<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d1b2a">
<title>SafeZone Admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/vendor/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
<script src="/js/theme.js"></script>
</head>
<body class="page-admin">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-water" viewBox="0 0 24 24"><path d="M12 2.7c3.6 4.4 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 2.4-6.6 6-11z" fill="currentColor"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M13.5 2 5 13.5h6L10 22l9-12h-6.2z" fill="currentColor"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4M4 4v4h4M4 13a8 8 0 0 0 14.5 4M20 20v-4h-4"/></g></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z" fill="currentColor"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g></symbol>
</svg>

<header class="topbar">
  <a class="brand" href="/" aria-label="SafeZone public site">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#i-water"/></svg></span>
    <span class="brand-text"><strong>SafeZone</strong><small>Admin console</small></span>
  </a>
  <nav class="topnav" aria-label="Main"><a href="/">View public site</a></nav>
  <div class="topbar-tools">
    <button class="btn small" id="logout" type="button" hidden>Sign out</button>
    <button type="button" class="icon-btn" id="themeBtn" aria-label="Switch theme"><svg class="ico"><use href="#i-moon"/></svg></button>
  </div>
</header>

<!-- sign in -->
<main class="login" id="loginView">
  <form class="login-card" id="loginForm">
    <h1>Sign in</h1>
    <p>Enter the admin token from your server's <code>.env</code> file. It stays in this browser tab only.</p>
    <label for="token">Admin token</label>
    <input id="token" class="field" type="password" autocomplete="current-password" required>
    <div class="form-error" id="loginError" role="alert" hidden></div>
    <button class="btn primary block" id="loginBtn" type="submit">Sign in</button>
  </form>
</main>

<!-- console -->
<main class="console" id="consoleView" hidden>
  <section class="kpis" id="kpis" aria-label="Summary"></section>

  <div class="console-grid">
    <section class="panel list-panel" aria-labelledby="h-list">
      <div class="panel-head">
        <h2 id="h-list">Advisories</h2>
        <button class="icon-btn small" id="reload" type="button" aria-label="Reload"><svg class="ico"><use href="#i-refresh"/></svg></button>
      </div>
      <div class="toolbar">
        <input id="filterText" class="field" type="search" placeholder="Search area or reason" aria-label="Search advisories">
        <select id="filterStatus" class="field" aria-label="Status">
          <option value="all">All statuses</option>
          <option value="ongoing">Ongoing</option>
          <option value="scheduled">Scheduled</option>
          <option value="recheck">Needs Recheck</option>
          <option value="restored">Restored</option>
        </select>
        <select id="filterType" class="field" aria-label="Service type">
          <option value="all">Water and electricity</option>
          <option value="water">Water</option>
          <option value="power">Electricity</option>
        </select>
      </div>
      <div id="list" class="adm-list"></div>
    </section>

    <section class="panel editor" aria-labelledby="h-edit">
      <div class="panel-head">
        <h2 id="h-edit">New advisory</h2>
        <button class="link-btn" id="cancelEdit" type="button" hidden>Cancel editing</button>
      </div>
      <div class="map-box">
        <div id="map"></div>
        <div class="map-note" id="mapNote">Click the map to set the zone center</div>
      </div>
      <form id="form" class="form" novalidate>
        <div class="full">
          <label id="l-type">Service</label>
          <div class="seg wide" id="typeSeg" role="group" aria-labelledby="l-type">
            <button type="button" data-v="water" class="on" aria-pressed="true">Water</button>
            <button type="button" data-v="power" aria-pressed="false">Electricity</button>
          </div>
        </div>

        <div class="full">
          <label for="provider">Utility Provider</label>
          <input id="provider" class="field" maxlength="140" placeholder="Davao Light and Power Company / Davao City Water District">
        </div>

        <div class="full">
          <label for="mappingLevel">GIS Mapping Coverage Level</label>
          <select id="mappingLevel" class="field">
            <option value="1">Level 1 — Exact Geographic Coverage (Verified GeoJSON Polygon)</option>
            <option value="2">Level 2 — Specific Location (Road Segment LineString or Landmark Point)</option>
            <option value="3" selected>Level 3 — Approximate Coverage (Fallback Circle with Disclaimer)</option>
          </select>
        </div>

        <div class="full">
          <label for="geometryJson">GeoJSON Geometry (Level 1 Polygon or Level 2 LineString / Point)</label>
          <textarea id="geometryJson" class="field" placeholder='{"type":"Polygon","coordinates":[[[125.62,7.10],[125.64,7.10],[125.64,7.12],[125.62,7.12],[125.62,7.10]]]}'></textarea>
        </div>

        <div class="full">
          <label for="specificLocations">Specific Affected Roads, Subdivisions, or Landmarks (comma-separated)</label>
          <input id="specificLocations" class="field" maxlength="400" placeholder="J.P. Laurel Ave, Arroyo St, Bajada Substation">
        </div>

        <div class="full">
          <label for="sourceUrl">Original Official Announcement URL</label>
          <input id="sourceUrl" class="field" type="url" maxlength="400" placeholder="https://www.davaolight.com/post/...">
        </div>

        <div>
          <label for="publishedAt">Announcement Publication Date</label>
          <input id="publishedAt" class="field" type="datetime-local">
        </div>
        <div>
          <label for="verification">Verification Status</label>
          <select id="verification" class="field">
            <option value="Officially Confirmed">Officially Confirmed</option>
            <option value="Unverified">Unverified</option>
            <option value="Community Report">Community Report</option>
          </select>
        </div>

        <div class="full">
          <label for="radius">Approximate zone radius (Level 3 fallback): <output id="radiusOut">1,500 m</output></label>
          <input id="radius" type="range" min="100" max="10000" step="100" value="1500">
        </div>

        <fieldset class="full loc">
          <legend>Affected location</legend>
          <div class="loc-grid">
            <div><label for="region">Region</label><select id="region" class="field"></select></div>
            <div><label for="province">Province</label><select id="province" class="field" disabled></select></div>
            <div><label for="city">City / municipality</label><select id="city" class="field" disabled></select></div>
            <div><label for="barangay">Barangay</label><select id="barangay" class="field" disabled></select></div>
          </div>
        </fieldset>

        <div class="full">
          <label for="area">Affected area and streets</label>
          <input id="area" class="field" maxlength="240" placeholder="Pick a barangay above, then add street details if needed">
        </div>
        <div class="full">
          <label for="reasonEn">Reason (English)</label>
          <input id="reasonEn" class="field" maxlength="400" placeholder="Pipe leak repair on the main line">
        </div>
        <div class="full">
          <label for="reasonCeb">Reason (Bisaya, optional)</label>
          <input id="reasonCeb" class="field" maxlength="400" placeholder="Gi-ayo ang nabuak nga tubo">
        </div>

        <div><label for="start">Starts</label><input id="start" class="field" type="datetime-local"></div>
        <div><label for="eta">Expected back</label><input id="eta" class="field" type="datetime-local"></div>
        <div class="full chips" id="durChips" aria-label="Set expected back time">
          <span>Duration</span>
          <button type="button" class="chip" data-h="2">2 h</button>
          <button type="button" class="chip" data-h="4">4 h</button>
          <button type="button" class="chip" data-h="8">8 h</button>
          <button type="button" class="chip" data-h="12">12 h</button>
          <button type="button" class="chip" data-h="24">24 h</button>
        </div>

        <div class="full">
          <label for="source">Source</label>
          <input id="source" class="field" maxlength="120" placeholder="Davao Light advisory, Nov 24">
        </div>
        <div class="full">
          <label for="note">Public note (optional)</label>
          <input id="note" class="field" maxlength="300" placeholder="e.g. Water trucks at the barangay hall">
        </div>

        <div><label for="lat">Latitude</label><input id="lat" class="field" type="number" step="any"></div>
        <div><label for="lng">Longitude</label><input id="lng" class="field" type="number" step="any"></div>

        <div class="full form-error" id="formError" role="alert" hidden></div>
        <div class="full actions">
          <button class="btn primary" id="submitBtn" type="submit">Publish advisory</button>
          <button class="btn" id="resetBtn" type="button">Clear form</button>
        </div>
      </form>
    </section>
  </div>
</main>

<dialog id="confirm" class="dialog" aria-labelledby="cTitle">
  <form method="dialog">
    <h2 id="cTitle"></h2><p id="cBody"></p>
    <div class="actions end"><button class="btn" value="cancel">Cancel</button><button class="btn danger" id="cOk" value="ok"></button></div>
  </form>
</dialog>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
